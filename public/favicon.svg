<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="heartGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="45%" stop-color="#E85D75"/>
      <stop offset="100%" stop-color="#BF2046"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#7B0C24" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Glowing Romantic Heart -->
  <path d="M32 55 C32 55 7 39 7 21 C7 11.5 14.5 5 23.5 5 C28.5 5 31.5 7.8 32 10.2 C32.5 7.8 35.5 5 40.5 5 C49.5 5 57 11.5 57 21 C57 39 32 55 32 55 Z"
        fill="url(#heartGrad)"
        filter="url(#glow)"/>

  <!-- Glossy Bevel Reflection Highlight -->
  <path d="M23.5 8 C16.5 8 10 13 10 21 C10 27 14.5 35 22 41 C18.5 34 15 27 15 20.5 C15 14.5 18.5 10 23.5 8 Z"
        fill="url(#glossGrad)"/>

  <!-- Golden 4-point Sparkle Accent -->
  <path d="M49 3 L50.6 8.4 L56 10 L50.6 11.6 L49 17 L47.4 11.6 L42 10 L47.4 8.4 Z"
        fill="url(#goldSparkle)"/>
</svg>